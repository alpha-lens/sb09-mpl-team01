name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mpl_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Test and build
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: testSecretKeyForMplProjectMinimumLengthRequired32Bytes
          TMDB_BEARER_TOKEN: dummy
          SPORTSDB_API_KEY: dummy
          ADMIN_EMAIL: system@mopl.io
          ADMIN_PASSWORD: mopl1!
          ADMIN_NAME: system
        run: ./gradlew clean test build --stacktrace --info