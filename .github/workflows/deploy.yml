name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - develop

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      EC2_HOST: 13.209.73.80
      EC2_USER: ubuntu
      REMOTE_DIR: /home/ubuntu/app
      JAR_NAME: mpl.jar

    steps:
      # develop 브랜치 push -> ci.yml 성공 후 실행되므로, 해당 CI 실행에서 만든 JAR을 그대로 내려받는다.
      - name: Download build artifact from CI run
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ./artifact

      - name: Rename jar to fixed deploy name
        run: |
          mkdir -p deploy
          cp ./artifact/*.jar deploy/${{ env.JAR_NAME }}

      - name: Set up SSH key and known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure remote app directory and Java 17 runtime exist
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ env.EC2_USER }}@${{ env.EC2_HOST }} '
            mkdir -p ${{ env.REMOTE_DIR }}
            if ! command -v java >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y openjdk-17-jre-headless
            fi
          '

      - name: Copy JAR to EC2
        run: |
          scp -i ~/.ssh/ec2_key.pem \
            deploy/${{ env.JAR_NAME }} \
            ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:${{ env.REMOTE_DIR }}/${{ env.JAR_NAME }}

      - name: Stop existing app and start new JAR
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ env.EC2_USER }}@${{ env.EC2_HOST }} '
            set -e
            APP_DIR="${{ env.REMOTE_DIR }}"
            JAR="${{ env.JAR_NAME }}"

            PID=$(pgrep -f "$JAR" || true)
            if [ -n "$PID" ]; then
              echo "Stopping existing process (PID: $PID)"
              kill -15 "$PID"
              for i in $(seq 1 10); do
                kill -0 "$PID" 2>/dev/null || break
                sleep 1
              done
              kill -0 "$PID" 2>/dev/null && kill -9 "$PID"
            fi

            cd "$APP_DIR"
            nohup java -jar "$JAR" --spring.profiles.active=prod > app.log 2>&1 &
            disown

            sleep 5
            if ! pgrep -f "$JAR" > /dev/null; then
              echo "Application failed to start. Last 50 lines of app.log:"
              tail -n 50 app.log
              exit 1
            fi
            echo "Deploy succeeded, new PID: $(pgrep -f "$JAR")"
          '

      - name: Clean up local SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key.pem
