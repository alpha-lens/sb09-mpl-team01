events {}

http {
    upstream mpl_backend {
        server mpl-app:8080;
    }

    # CloudFront가 이미 X-Forwarded-Proto를 보냈으면 그 값을 그대로 쓰고,
    # 없을 때만 nginx 자신이 받은 프로토콜($scheme)로 대체한다.
    # (그대로 $scheme만 쓰면 CloudFront->ALB->nginx 구간이 전부 HTTP라서
    # 실제 사용자가 HTTPS로 접속했어도 http로 덮어써지는 문제가 있었음)
    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 20M;

        location / {
            proxy_pass http://mpl_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        }

        location /ws {
            proxy_pass http://mpl_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /api/sse {
            proxy_pass http://mpl_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }
    }
}