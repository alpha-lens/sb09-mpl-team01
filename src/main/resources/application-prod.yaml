server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 5000
      leak-detection-threshold: 2000

  jpa:
    show-sql: false

  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: ${SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL}
      sasl.mechanism: ${SPRING_KAFKA_PROPERTIES_SASL_MECHANISM}
      sasl.jaas.config: ${SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:true}


content:
  collection:
    tmdb:
      initial-max-pages: ${TMDB_INITIAL_MAX_PAGES:300}
      daily-max-pages: ${TMDB_DAILY_MAX_PAGES:20}

    scheduler:
      enabled: true
      cron: ${CONTENT_COLLECTION_CRON:0 0 3 * * *}
      zone: ${CONTENT_COLLECTION_ZONE:Asia/Seoul}