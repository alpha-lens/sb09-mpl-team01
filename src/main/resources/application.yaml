spring:
  main:
    allow-bean-definition-overriding: true

  application:
    name: mpl

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  profiles:
    default: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:

  sql:
    init:
      schema-locations: classpath:schema.sql
      mode: always

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope: profile_nickname
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}
  name: ${ADMIN_NAME}

tmdb:
  base-url: https://api.themoviedb.org/3
  image-base-url: https://image.tmdb.org/t/p/w500
  bearer-token: ${TMDB_BEARER_TOKEN}

# SportsDB 사용 여부는 이 최상위 설정으로 결정됩니다.
# content.collection 아래에 sports 블록이 없어도 이 설정을 통해 정상 호출됩니다.
sportsdb:
  base-url: https://www.thesportsdb.com/api/v1/json
  api-key: ${SPORTSDB_API_KEY}

mpl:
  frontend:
    base-url: ${FRONTEND_BASE_URL}
  storage:
    type: ${STORAGE_TYPE:local}

    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.mpl/storage}

    s3:
      access-key: ${AWS_S3_ACCESS_KEY:}
      secret-key: ${AWS_S3_SECRET_KEY:}
      region: ${AWS_S3_REGION:}
      bucket: ${AWS_S3_BUCKET:}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600}

content:
  collection:
    tmdb:
      initial-max-pages: ${TMDB_INITIAL_MAX_PAGES:300}
      daily-max-pages: ${TMDB_DAILY_MAX_PAGES:20}

    scheduler:
      enabled: false
      cron: "0 0 3 * * *"
      zone: "Asia/Seoul"